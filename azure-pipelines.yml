# Backup Manager queues this pipeline and sets BackupManagerPolicyRemovePayload (JSON).
# Put secrets in a Variable Group or Pipeline variables (secret): AZURE_TENANT_ID, GRAPH_CLIENT_ID, GRAPH_CLIENT_SECRET
# Create environment "production-entra" and add an Approval check.

trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: backup-manager-graph   # optional: holds AZURE_TENANT_ID, GRAPH_CLIENT_ID, GRAPH_CLIENT_SECRET

stages:
- stage: Remove
  displayName: Remove tenant policies
  jobs:
  - deployment: DeleteAfterApproval
    displayName: Delete in Entra (after DevOps approval)
    environment: production-entra
    strategy:
      runOnce:
        deploy:
          steps:
          - bash: |
              set -euo pipefail
              command -v jq >/dev/null || (sudo apt-get update -y && sudo apt-get install -y jq)

              echo "Payload:"
              echo "$PAYLOAD" | jq .

              POLICY_TYPE=$(echo "$PAYLOAD" | jq -r .policy_type)
              IDS=$(echo "$PAYLOAD" | jq -r '.policy_ids[]?')

              TOKEN=$(curl -sS -X POST "https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token" \
                -H "Content-Type: application/x-www-form-urlencoded" \
                -d "client_id=${GRAPH_CLIENT_ID}" \
                -d "client_secret=${GRAPH_CLIENT_SECRET}" \
                -d "scope=https%3A%2F%2Fgraph.microsoft.com%2F.default" \
                -d "grant_type=client_credentials" | jq -r .access_token)

              if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
                echo "Failed to acquire Graph token"
                exit 1
              fi

              BASE="https://graph.microsoft.com/beta"
              case "$POLICY_TYPE" in
                conditional_access)
                  PATH_TMPL="/identity/conditionalAccess/policies/%s" ;;
                device_configuration)
                  PATH_TMPL="/deviceManagement/deviceConfigurations/%s" ;;
                configuration)
                  PATH_TMPL="/deviceManagement/configurationPolicies/%s" ;;
                compliance)
                  PATH_TMPL="/deviceManagement/deviceCompliancePolicies/%s" ;;
                *)
                  echo "Unknown policy_type: $POLICY_TYPE"
                  exit 1 ;;
              esac

              for ID in $IDS; do
                [ -z "$ID" ] && continue
                URL="${BASE}$(printf "$PATH_TMPL" "$ID")"
                echo "DELETE $URL"
                CODE=$(curl -sS -o /tmp/gr.out -w "%{http_code}" -X DELETE "$URL" \
                  -H "Authorization: Bearer ${TOKEN}")
                echo "HTTP $CODE"
                cat /tmp/gr.out || true
                if [ "$CODE" != "204" ] && [ "$CODE" != "200" ]; then
                  echo "Delete failed for $ID"
                  exit 1
                fi
              done

              echo "All deletes completed."
            displayName: Parse payload and delete via Graph
            env:
              PAYLOAD: $(BackupManagerPolicyRemovePayload)
              AZURE_TENANT_ID: $(AZURE_TENANT_ID)
              GRAPH_CLIENT_ID: $(GRAPH_CLIENT_ID)
              GRAPH_CLIENT_SECRET: $(GRAPH_CLIENT_SECRET)